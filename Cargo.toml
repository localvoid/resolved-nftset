[package]
publish = false
name = "resolved-nftset"
version = "1.0.0"
edition = "2024"
description = "Monitor systemd-resolved DNS queries and add matching IPs to nftables sets"
license = "(MIT OR Apache-2.0)"

[[bin]]
name = "resolved-nftset"
path = "src/main.rs"

[dependencies]
libc = "1.0.0-alpha.3"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
fqdn = "0.5"
fqdn-trie = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
collapsible_if = "allow"
collapsible_else_if = "allow"
collapsible_match = "allow"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = false
